[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsa-cognitive-mapping"
version = "0.1.0"
description = "Vector Symbolic Architecture Cognitive Mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "pyyaml",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/vsa_cognitive_mapping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that run real training steps or need network access"]
