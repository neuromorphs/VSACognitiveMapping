[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsa-cognitive-mapping"
version = "0.1.0"
description = "Vector Symbolic Architecture Cognitive Mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
notebook = [
    "jupyter",
    "ipykernel",
    "pillow",
]
detection = [
    "ultralytics",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vsa_cognitive_mapping"]
