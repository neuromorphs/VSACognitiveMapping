# From-scratch baseline on run1 only: same split and budget as the finetune
# config, but random init and full lr. Quantifies what SCAND pretraining adds.
seed: 0
device: cpu

data:
  root: data/spot_run1
  val_fraction: 0.7
  img_size: 224
  frame_skip: 1

model:
  backbone: dinov2_vits14
  backbone_dim: 384
  latent_dim: 128
  lam: 0.1
  predictor:
    kind: mlp
    hidden_dim: 256
    action_embed_dim: 32
  sigreg:
    num_projections: 256
    knots: 17
    t_max: 3.0

train:
  epochs: 150
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 0.01
  warmup_steps: 20
  grad_clip: 1.0
  log_every: 20
  checkpoint_every_epochs: 50
  out_dir: checkpoints/jepa_run1_scratch
